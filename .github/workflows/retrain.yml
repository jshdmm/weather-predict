name: Retrain

on:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 UTC
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: pip

      - name: Install
        run: make install

      - name: Pull weather.db from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make db-pull

      - name: Train model
        run: make train

      - name: Push weather.db to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make db-push

      - name: Upload model to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make upload

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.run_id }}
          path: results/
          retention-days: 14
